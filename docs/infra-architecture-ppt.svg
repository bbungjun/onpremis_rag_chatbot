<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">LLM Enhance RAG Chatbot Infrastructure Architecture</title>
  <desc id="desc">Infrastructure architecture diagram for the Streamlit, FastAPI, Qdrant, Ollama, Vertex Gemini, and AWS Bedrock RAG chatbot deployment.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef6ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow-blue" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L14,8 L2,14 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L14,8 L2,14 Z" fill="#059669"/>
    </marker>
    <marker id="arrow-purple" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L14,8 L2,14 Z" fill="#7c3aed"/>
    </marker>
    <style>
      .font { font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Segoe UI", Arial, sans-serif; }
      .title { font-size: 54px; font-weight: 800; fill: #0f172a; }
      .subtitle { font-size: 24px; font-weight: 600; fill: #475569; }
      .section { font-size: 26px; font-weight: 800; fill: #0f172a; }
      .label { font-size: 24px; font-weight: 800; fill: #0f172a; }
      .body { font-size: 19px; font-weight: 600; fill: #334155; }
      .small { font-size: 16px; font-weight: 600; fill: #475569; }
      .tiny { font-size: 14px; font-weight: 600; fill: #64748b; }
      .badge { font-size: 15px; font-weight: 800; fill: #ffffff; }
      .pipeline-title { font-size: 19px; font-weight: 800; fill: #ffffff; }
      .pipeline-step { font-size: 16px; font-weight: 700; fill: #dbeafe; }
      .box { rx: 20; ry: 20; filter: url(#shadow); }
      .thin { stroke-width: 2.5; }
      .thick { stroke-width: 5; }
      .dash { stroke-dasharray: 12 10; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect x="34" y="34" width="1852" height="1012" rx="34" fill="#ffffff" stroke="#dbeafe" stroke-width="2"/>

  <text class="font title" x="76" y="104">LLM Enhance RAG Chatbot 인프라 아키텍처</text>
  <text class="font subtitle" x="78" y="146">EC2 온프레미스형 배포 가정 · GPU host · Public UI http://YOUR_EC2_PUBLIC_IP:8501</text>

  <g id="github-deploy">
    <rect class="box" x="76" y="184" width="365" height="116" fill="#f8fafc" stroke="#94a3b8" stroke-width="2.5"/>
    <text class="font label" x="104" y="225">GitHub Repository</text>
    <text class="font body" x="104" y="258">main / PR merge 후 배포</text>
    <text class="font small" x="104" y="282">git pull · docker compose up -d --build</text>
  </g>

  <g id="user">
    <rect class="box" x="76" y="430" width="365" height="168" fill="#eff6ff" stroke="#60a5fa" stroke-width="3"/>
    <circle cx="133" cy="492" r="34" fill="#2563eb"/>
    <path d="M133 472 C143 472 151 480 151 490 C151 500 143 508 133 508 C123 508 115 500 115 490 C115 480 123 472 133 472 Z" fill="#ffffff"/>
    <path d="M107 552 C113 530 153 530 159 552" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
    <text class="font label" x="190" y="480">사용자 브라우저</text>
    <text class="font body" x="190" y="515">Streamlit 화면 접속</text>
    <text class="font small" x="190" y="544">질문 입력 · 모델 토글 선택</text>
      <text class="font tiny" x="190" y="570">Qwen / EXAONE / Gemini / Bedrock</text>
  </g>

  <g id="ec2-boundary">
    <rect x="510" y="182" width="860" height="766" rx="30" fill="#f8fbff" stroke="#2563eb" stroke-width="4"/>
    <rect x="510" y="182" width="860" height="76" rx="30" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
    <text class="font section" x="542" y="230">AWS EC2 Runtime</text>
    <text class="font body" x="795" y="230">Ubuntu host · Docker Compose · /opt/llmenhance/app</text>
  </g>

  <g id="security">
    <rect x="544" y="286" width="792" height="82" rx="18" fill="#fffbeb" stroke="#f59e0b" stroke-width="2.5"/>
    <text class="font label" x="574" y="320">Security Group</text>
    <text class="font body" x="574" y="350">8501: 0.0.0.0/0 공개 · 22/11434: 개발자 IP /32 제한</text>
    <rect x="1160" y="304" width="142" height="34" rx="17" fill="#f59e0b"/>
    <text class="font badge" x="1188" y="327">Ingress</text>
  </g>

  <g id="docker-compose">
    <rect x="544" y="404" width="792" height="336" rx="24" fill="#ffffff" stroke="#93c5fd" stroke-width="3"/>
    <text class="font section" x="574" y="448">Docker Compose</text>

    <g id="streamlit">
      <rect class="box" x="574" y="480" width="218" height="176" fill="#ecfeff" stroke="#06b6d4" stroke-width="3"/>
      <rect x="598" y="506" width="82" height="32" rx="16" fill="#06b6d4"/>
      <text class="font badge" x="615" y="528">8501</text>
      <text class="font label" x="598" y="574">Streamlit UI</text>
      <text class="font small" x="598" y="606">frontend/streamlit_app.py</text>
      <text class="font small" x="598" y="632">비교 패널 렌더링</text>
    </g>

    <g id="api">
      <rect class="box" x="836" y="480" width="228" height="176" fill="#eef2ff" stroke="#6366f1" stroke-width="3"/>
      <rect x="860" y="506" width="82" height="32" rx="16" fill="#6366f1"/>
      <text class="font badge" x="877" y="528">8000</text>
      <text class="font label" x="860" y="574">FastAPI RAG</text>
      <text class="font small" x="860" y="606">/api/ask/qwen</text>
      <text class="font small" x="860" y="632">/api/ask/gemini · /bedrock</text>
    </g>

    <g id="qdrant">
      <rect class="box" x="1108" y="480" width="198" height="176" fill="#f0fdf4" stroke="#22c55e" stroke-width="3"/>
      <rect x="1132" y="506" width="82" height="32" rx="16" fill="#22c55e"/>
      <text class="font badge" x="1149" y="528">6333</text>
      <text class="font label" x="1132" y="574">Qdrant</text>
      <text class="font small" x="1132" y="606">llmenhance_chunks</text>
      <text class="font small" x="1132" y="632">dense + sparse hybrid</text>
    </g>

    <g id="volumes">
      <rect x="574" y="684" width="732" height="32" rx="16" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
      <text class="font tiny" x="598" y="706">Docker volumes: qdrant_data, rag_storage · GCP credentials mounted read-only into rag-api</text>
    </g>
  </g>

  <g id="host-ollama">
    <rect x="544" y="774" width="792" height="126" rx="24" fill="#faf5ff" stroke="#a855f7" stroke-width="3"/>
    <text class="font section" x="574" y="818">Host Ollama Runtime</text>
    <text class="font body" x="574" y="852">http://172.17.0.1:11434 내부 연결 · EC2 호스트에서 모델 실행</text>
    <rect x="574" y="866" width="190" height="34" rx="17" fill="#7c3aed"/>
    <text class="font badge" x="621" y="889">bge-m3</text>
    <rect x="786" y="866" width="208" height="34" rx="17" fill="#7c3aed"/>
    <text class="font badge" x="819" y="889">qwen3:4b-instruct</text>
    <rect x="1016" y="866" width="188" height="34" rx="17" fill="#7c3aed"/>
    <text class="font badge" x="1040" y="889">exaone3.5:7.8b</text>
    <rect x="1226" y="866" width="82" height="34" rx="17" fill="#7c3aed"/>
    <text class="font badge" x="1247" y="889">11434</text>
  </g>

  <g id="external">
    <rect x="1440" y="300" width="374" height="548" rx="30" fill="#fff7ed" stroke="#f97316" stroke-width="4"/>
    <text class="font section" x="1474" y="350">External AI Services</text>

    <rect class="box" x="1474" y="398" width="306" height="148" fill="#ffffff" stroke="#f97316" stroke-width="3"/>
    <text class="font label" x="1504" y="444">Google Vertex AI</text>
    <text class="font body" x="1504" y="478">Gemini RAG generation</text>
    <text class="font small" x="1504" y="510">gemini-2.5-flash · thinking_budget=0</text>

    <rect class="box" x="1474" y="586" width="306" height="148" fill="#ffffff" stroke="#ef4444" stroke-width="3"/>
    <text class="font label" x="1504" y="632">AWS Bedrock</text>
    <text class="font body" x="1504" y="666">Claude Sonnet 4.6</text>
    <text class="font small" x="1504" y="698">region ap-northeast-3</text>

    <rect x="1474" y="772" width="306" height="40" rx="20" fill="#fed7aa"/>
    <text class="font small" x="1510" y="797">Cloud LLM은 동일 RAG context 사용</text>
  </g>

  <g id="flow-lines" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M441 243 C482 243 487 222 510 222" stroke="#2563eb" class="thick" marker-end="url(#arrow-blue)"/>
    <text class="font tiny" x="450" y="214" fill="#2563eb">deploy</text>

    <path d="M441 514 C507 514 507 568 574 568" stroke="#2563eb" class="thick" marker-end="url(#arrow-blue)"/>
    <text class="font tiny" x="456" y="552" fill="#2563eb">HTTP :8501</text>

    <path d="M792 568 L836 568" stroke="#2563eb" class="thick" marker-end="url(#arrow-blue)"/>
    <text class="font tiny" x="796" y="548" fill="#2563eb">POST</text>

    <path d="M1064 568 L1108 568" stroke="#059669" class="thick" marker-end="url(#arrow-green)"/>
    <text class="font tiny" x="1064" y="548" fill="#059669">search</text>

    <path d="M950 656 C950 716 812 724 812 774" stroke="#7c3aed" class="thick" marker-end="url(#arrow-purple)"/>
    <text class="font tiny" x="810" y="750" fill="#7c3aed">embedding + local generation</text>

    <path d="M1108 632 C1035 710 1025 750 958 774" stroke="#059669" class="thick" marker-end="url(#arrow-green)"/>
    <text class="font tiny" x="1062" y="718" fill="#059669">sources</text>

    <path d="M1064 512 C1212 440 1342 430 1474 470" stroke="#f97316" class="thick" marker-end="url(#arrow-purple)"/>
    <text class="font tiny" x="1220" y="430" fill="#7c3aed">Gemini endpoint</text>

    <path d="M1064 624 C1214 714 1344 724 1474 660" stroke="#ef4444" class="thick" marker-end="url(#arrow-purple)"/>
    <text class="font tiny" x="1220" y="746" fill="#7c3aed">Bedrock endpoint</text>
  </g>

  <g id="pipeline">
    <rect x="76" y="956" width="1738" height="66" rx="22" fill="#0f172a"/>
    <text class="font pipeline-title" x="112" y="996">Request flow:</text>
    <text class="font pipeline-step" x="260" y="996">1 질문 입력</text>
    <text class="font pipeline-step" x="395" y="996">2 FastAPI 라우팅</text>
    <text class="font pipeline-step" x="570" y="996">3 질의 해석</text>
    <text class="font pipeline-step" x="715" y="996">4 bge-m3 임베딩</text>
    <text class="font pipeline-step" x="895" y="996">5 Qdrant hybrid search</text>
    <text class="font pipeline-step" x="1140" y="996">6 선택 모델 생성</text>
    <text class="font pipeline-step" x="1328" y="996">7 답변 + 참고문서 반환</text>
  </g>
</svg>
